<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>外據點聯絡系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1c2230; --muted:#5f6878; --line:#dde1e8;
  --accent:#1f4e8c; --accent-fg:#ffffff; --accent-soft:#e6eef9;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#b4231f; --warn-soft:#fbe7e6; --pending:#8a92a3;
  --font:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141821; --surface:#1d222d; --fg:#e8ebf1; --muted:#9aa3b5; --line:#303746;
  --accent:#7aa6e6; --accent-fg:#0f1420; --accent-soft:#223149;
  --ok:#6cc595; --ok-soft:#1d3328; --warn:#f08a86; --warn-soft:#3d2224; --pending:#6c7484; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px 0}
.brand{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-chip{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.tabs{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;color:var(--muted);font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card.clickable{cursor:pointer}
.card.clickable:active{background:var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.title{font-weight:700;font-size:16px}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--line);color:var(--muted)}
.pill.closed{background:var(--line);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.body-text{white-space:pre-wrap;word-break:break-word}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar.meter>i{background:var(--accent)}
.bar.meter.hi>i{background:var(--warn)}
.usage-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-top:6px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell.ok{background:var(--ok-soft);border-color:transparent;cursor:pointer}
.cell.ok:active,.cell.focus{outline:2px solid var(--accent);outline-offset:-2px}
.cell .code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cell .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .st{font-size:11px;color:var(--muted)}
.cell.ok .st{color:var(--ok)}
.group-h{font-size:13px;color:var(--muted);font-weight:500;margin-top:6px;display:flex;justify-content:space-between}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{border:1px solid var(--line);border-radius:8px;overflow:hidden;width:96px;position:relative;background:var(--bg)}
.file img{display:block;width:96px;height:96px;object-fit:cover}
.file .pdf{width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;color:var(--warn)}
.file .fn{font-size:11px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.file .rm{position:absolute;top:4px;right:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:24px;height:24px;cursor:pointer;line-height:1;font-size:14px}
.file a{display:block;color:inherit;text-decoration:none}
.site-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.site-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;min-height:48px;cursor:pointer;text-align:left}
.site-btn b{display:block;font-size:12px;color:var(--muted);font-family:var(--mono);font-weight:400}
.site-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.section-h{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.back{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;font-weight:500}
.notice{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:10px 12px;font-size:13px}
.overdue{color:var(--warn);font-weight:500}
.reply-list{display:flex;flex-direction:column;gap:8px}
.reply-item{border-top:1px solid var(--line);padding-top:10px}
code{font-family:var(--mono);font-size:13px;background:var(--bg);padding:1px 5px;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">外據點聯絡系統</div>
    <button class="site-chip" id="siteChip" type="button">選擇據點</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="home" type="button">公告</button>
    <button class="tab" role="tab" aria-selected="false" data-view="dash" type="button">儀表板</button>
    <button class="tab" role="tab" aria-selected="false" data-view="admin" type="button">管理</button>
  </div>
</header>

<main>
  <div id="app" class="view"><div class="empty">載入中…</div></div>
</main>

<!-- Firebase（compat 版，直接從 CDN 載入，不需安裝） -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   ★ 設定區 ★
   FIREBASE_CONFIG：到 Firebase 主控台 → 專案設定 → 「您的應用程式」→ 網頁應用程式，
   把畫面上 const firebaseConfig = { ... } 大括號裡的內容整段貼進來。

   帳號：每個據點一個帳號，管理者一個帳號（Firebase Authentication）。
   帳號名稱固定為「據點代碼小寫@authDomain」，例如 sc0@site-portal-8153a.firebaseapp.com，
   管理者為 admin@site-portal-8153a.firebaseapp.com。同仁登入時只要選據點、輸入密碼即可。
   權限由 Firestore 規則把關：據點只能新增／修改「自己站別」的回覆與附件，
   公告的新增、修改、刪除與所有刪除動作只有管理者可以做。
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCfCZNWeh6KUCNBejOeb7GwPeaQzyk5yUQ",
  authDomain: "site-portal-8153a.firebaseapp.com",
  projectId: "site-portal-8153a",
  storageBucket: "site-portal-8153a.firebasestorage.app",
  messagingSenderId: "757047720502",
  appId: "1:757047720502:web:95ca0a121c573839667697"
};
const ACCOUNT_DOMAIN = FIREBASE_CONFIG.authDomain;   // 帳號網域（不必改）
const ADMIN_CODE = "ADMIN";
/* ===================================================================== */

/* ---------- 據點資料 ---------- */
const SITES = [
  ...[["SC0","基隆"],["SC3","東區"],["SC4","北區"],["SC8","三重"],["SC1","宜蘭"],["SC2","花蓮"],["SC5","西區"],["SC7","中和"],["SC6","金門"],
     ["SD0","桃園"],["SD8","中壢"],["SD1","新竹"],["SD2","苗栗"],["SD3","台中"],["SD4","清水"],["SD5","豐原"],["SD6","彰化"],["SD7","草屯"],
     ["SE0","嘉義"],["SE1","虎尾"],["SE2","新營"],["SE3","台南"],["SE4","高北"],["SE5","高南"],["SE6","岡山"],["SE7","澎湖"],["SE8","屏東"],["SE9","台東"]]
     .map(([c,n])=>({code:c,name:n,group:"服務站",region:{SC:"北區",SD:"中區",SE:"南區"}[c.slice(0,2)]})),
  {code:"F01",name:"五股廠",group:"工廠"},{code:"F02",name:"中和廠",group:"工廠"},
  ...["宜蘭","花蓮","桃園","竹苗","台中","彰投","雲嘉","台南","高雄","屏東","台東"]
     .map((n,i)=>({code:"B"+String(i+1).padStart(2,"0"),name:n+"營業",group:"營業所"}))
];
const GROUPS = ["服務站","營業所","工廠"];
const REGIONS = ["北區","中區","南區"];
/* 顯示用的分段：服務站依北中南拆開，其餘照群組 */
const SECTIONS = [
  ...REGIONS.map(r=>({label:"服務站・"+r, list:SITES.filter(s=>s.group==="服務站"&&s.region===r)})),
  {label:"營業所", list:SITES.filter(s=>s.group==="營業所")},
  {label:"工廠", list:SITES.filter(s=>s.group==="工廠")}
];
const siteByCode = Object.fromEntries(SITES.map(s=>[s.code,s]));
const showCode = s => s.group==="服務站";
const emailOf = code => code.toLowerCase()+"@"+ACCOUNT_DOMAIN;
const codeOf = email => { const m=String(email||"").toLowerCase().match(/^([a-z0-9]+)@(.+)$/); if(!m||m[2]!==ACCOUNT_DOMAIN.toLowerCase()) return null; const c=m[1].toUpperCase(); return (c===ADMIN_CODE||siteByCode[c])?c:null; };
const siteLabel = s => s ? (showCode(s)?`${s.code} ${s.name}`:s.name) : "";

/* ---------- 狀態 ---------- */
const S = {
  view:"home", projectId:null, site:null,
  db:null, auth:null, user:null, me:null, authReady:false, unsub:[],
  canEdit:false, fileCache:{},
  projects:[], replies:{}, loaded:false, loadErr:null,
  draft:{}, uploading:false, editingProject:null, acct:null,
  store:null, clearing:null, orphanJob:null, orphConfirm:false, focusSite:null, zipping:null, filter:"all"
};
const LS = { get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}, del:k=>{try{localStorage.removeItem(k);}catch(e){}} };
["pass","admin"].forEach(k=>LS.del(k));   // 舊版通關密碼紀錄，已不使用
try{ const v=location.hash.replace("#",""); if(["home","dash","admin"].includes(v)) S.view=v; }catch(e){}

const app = document.getElementById("app");
const toastEl = (()=>{let t=null;return (msg)=>{ if(t) t.remove(); t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>{t&&t.remove();t=null;},2600); };})();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const today = () => new Date().toISOString().slice(0,10);
const isOverdue = p => p.status==="open" && p.deadline && p.deadline < today();
const replyKey = (pid,code)=> pid+"__"+code;
const fmtSize = b => { b=b||0;
  if(b>=1073741824) return (b/1073741824).toFixed(1).replace(/\.0$/,"")+" GB";
  if(b>=1048576) return (b/1048576).toFixed(b>=104857600?0:1).replace(/\.0$/,"")+" MB";
  if(b>=1024) return Math.round(b/1024)+" KB";
  return b+" B"; };
const replyKeysOf = pid => Object.keys(S.replies).filter(k=>k.startsWith(pid+"__"));
function projectFileList(pid){ const p=S.projects.find(x=>x.id===pid); return [...(p?.files||[]), ...replyKeysOf(pid).flatMap(k=>S.replies[k].files||[])]; }
function projectStats(pid){ const l=projectFileList(pid); return {count:l.length, bytes:l.reduce((a,f)=>a+(f.size||0),0)}; }
function referencedIds(){
  const set=new Set(), add=fs=>(fs||[]).forEach(f=>f&&f.id&&set.add(f.id));
  S.projects.forEach(p=>add(p.files)); Object.values(S.replies).forEach(r=>add(r.files));
  if(S.editingProject) add(S.editingProject.files); Object.values(S.draft).forEach(d=>add(d.files));
  return set;
}
function replyFilesHTML(r){
  if(r.filesClearedAt && !(r.files&&r.files.length)) return `<div class="meta">附件已於 ${fmtDate(r.filesClearedAt)} 清除</div>`;
  return filesHTML(r.files,false);
}

/* ---------- 導覽 ---------- */
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ S.view=b.dataset.view; S.projectId=null; try{location.hash=S.view;}catch(e){} render(); }));
window.addEventListener("hashchange",()=>{ const v=location.hash.replace("#",""); if(["home","dash","admin"].includes(v)&&v!==S.view){S.view=v;S.projectId=null;render();} });
document.getElementById("siteChip").addEventListener("click",()=>{ if(!S.user) return; S.view="account"; S.projectId=null; render(); });

/* ---------- 渲染 ---------- */
function render(){
  const adminTab=document.querySelector('.tab[data-view="admin"]'); if(adminTab) adminTab.hidden=!S.canEdit;
  if(S.view==="admin" && S.user && !S.canEdit) S.view="home";
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.view===S.view)));
  const chip=document.getElementById("siteChip");
  chip.hidden = !S.user;
  chip.textContent = S.canEdit ? (S.site?`管理者・代${siteByCode[S.site]?.name||S.site}`:"管理者") : (siteByCode[S.site]?.name || "");
  if(S.loadErr){ app.innerHTML=`<div class="card"><div class="title">目前無法連線到資料</div><div class="meta" style="margin-top:4px">${S.loadErr}</div>${S.user?`<div class="row" style="margin-top:10px"><button type="button" class="btn sm" id="errOut">登出</button></div>`:""}</div>`; document.getElementById("errOut")?.addEventListener("click",logout); return; }
  if(!S.authReady){ app.innerHTML=`<div class="empty">載入中…</div>`; return; }
  if(!S.user) return renderLogin();
  if(S.view==="account") return renderAccount();
  if(S.view==="pick") return S.canEdit ? renderPick(false) : renderAccount();
  if(S.canEdit && !S.site && S.view!=="admin" && S.view!=="dash"){ renderPick(true); return; }
  if(!S.loaded){ app.innerHTML=`<div class="empty">載入中…</div>`; return; }
  if(S.view==="home") return S.projectId ? renderProject() : renderHome();
  if(S.view==="dash") return S.projectId ? renderDashProject() : renderDash();
  if(S.view==="admin") return renderAdmin();
}

/* ---------- 登入 ---------- */
function authMsg(e){
  const c=e?.code||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) return "據點或密碼不正確";
  if(/too-many-requests/.test(c)) return "嘗試次數太多，請稍候幾分鐘再試";
  if(/operation-not-allowed/.test(c)) return "系統尚未啟用帳號登入，請通知管理者（Firebase → Authentication → 啟用「電子郵件/密碼」）";
  if(/user-disabled/.test(c)) return "此帳號已被停用，請洽管理者";
  if(/network/.test(c)) return "網路連線有問題，請檢查後再試";
  return "登入失敗（"+c+"）";
}
function renderLogin(){
  const last=LS.get("loginSite")||"";
  const opts = SECTIONS.map(sec=>`<optgroup label="${esc(sec.label)}">${sec.list.map(s=>`<option value="${s.code}" ${s.code===last?"selected":""}>${esc(siteLabel(s))}</option>`).join("")}</optgroup>`).join("")
    + `<optgroup label="其他"><option value="${ADMIN_CODE}" ${last===ADMIN_CODE?"selected":""}>管理者</option></optgroup>`;
  app.innerHTML=`<div class="card form"><div class="title">登入</div>
    <div class="meta">請選擇您的據點並輸入該據點的密碼。登入後只能回覆自己據點的資料；此裝置會保持登入，直到按「登出」。</div>
    <div class="field"><label for="loginSite">據點</label><select id="loginSite"><option value="" ${last?"":"selected"} disabled>請選擇據點</option>${opts}</select></div>
    <div class="field"><label for="loginPass">密碼</label><input type="password" id="loginPass" placeholder="據點密碼" autocomplete="current-password"></div>
    <button type="button" class="btn primary" id="loginGo">登入</button>
    <div class="meta">忘記密碼請洽管理者重新設定。</div></div>`;
  const sel=document.getElementById("loginSite"), inp=document.getElementById("loginPass"), btn=document.getElementById("loginGo");
  const go=async()=>{
    if(!sel.value){ toastEl("請先選擇據點"); return; }
    if(!inp.value){ toastEl("請輸入密碼"); return; }
    btn.disabled=true; btn.textContent="登入中…";
    try{ LS.set("loginSite",sel.value); await S.auth.signInWithEmailAndPassword(emailOf(sel.value), inp.value); }
    catch(e){ toastEl(authMsg(e)); btn.disabled=false; btn.textContent="登入"; }
  };
  btn.addEventListener("click",go);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  (sel.value?inp:sel).focus();
}
async function logout(){
  S.unsub.forEach(f=>{try{f();}catch(e){}}); S.unsub=[];
  try{ await S.auth.signOut(); }catch(e){}
}
function renderAccount(){
  const s=siteByCode[S.site];
  app.innerHTML=`<div class="card form">
    <div class="title">${S.canEdit?"管理者帳號":esc(siteLabel(s))}</div>
    <div class="meta">${S.canEdit
      ? (s?`目前代 <b>${esc(siteLabel(s))}</b> 檢視與回覆。管理者可代任何據點回覆。`:"尚未選擇代理的據點。")
      : "您目前以此據點登入，只能新增或修改本據點的回覆。若要回覆其他據點，請登出後用該據點的帳號登入。"}</div>
    <div class="row">${S.canEdit?`<button type="button" class="btn" id="accPick">切換代理據點</button>`:""}<button type="button" class="btn danger" id="accOut">登出</button><button type="button" class="btn" id="accBack">返回</button></div>
  </div>`;
  document.getElementById("accPick")?.addEventListener("click",()=>{ S.view="pick"; render(); });
  document.getElementById("accOut").addEventListener("click",logout);
  document.getElementById("accBack").addEventListener("click",()=>{ S.view="home"; render(); });
}

function renderPick(first){
  const groups = SECTIONS.map(sec=>`
    <div class="section-h">${sec.label}</div>
    <div class="site-list">${sec.list.map(s=>`<button type="button" class="site-btn" data-code="${s.code}" aria-pressed="${s.code===S.site}">${showCode(s)?`<b>${s.code}</b>`:""}${esc(s.name)}</button>`).join("")}</div>`).join("");

async function fileBytes(id){
  const doc=S.db.collection("files").doc(id);
  const meta=await doc.get(); if(!meta.exists) throw new Error("missing");
  const n=meta.data().chunks||0, parts=[];
  for(let i=0;i<n;i++){ const c=await doc.collection("chunks").doc(String(i)).get(); if(!c.exists) throw new Error("missing"); parts.push(c.data().data.toUint8Array()); }
  return {parts,type:meta.data().type||""};
}
async function fileURL(id,type){
  if(S.fileCache[id]) return S.fileCache[id];
  const {parts,type:t}=await fileBytes(id);
  const url=URL.createObjectURL(new Blob(parts,{type:t||type}));
  S.fileCache[id]=url; return url;
}

async function shrinkImage(file){
  if(!file.type.startsWith("image/")) return file;
  try{
    const bmp = await createImageBitmap(file);
    const max=1800, sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
    if(sc===1 && file.size<2.5e6 && /jpeg|png|webp/.test(file.type)) return file;
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(res=>c.toBlob(res,"image/jpeg",0.85));
    return blob ? new File([blob], file.name.replace(/\.[^.]+$/,"")+".jpg", {type:"image/jpeg"}) : file;
  }catch(e){ return file; }
}
/* 附件切成 900 KB 的區塊存進 Firestore（免費方案不必開 Storage）；回傳 {id,name,type,size,chunks,thumb} */
const CHUNK=900*1024, MAX_FILE=20*1048576;
async function makeThumb(file){
  try{ const bmp=await createImageBitmap(file); const sc=Math.min(1,200/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(bmp.width*sc)); c.height=Math.max(1,Math.round(bmp.height*sc));
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return c.toDataURL("image/jpeg",0.7); }catch(e){ return null; }
}
async function uploadFile(f0,onProgress){
  const f = await shrinkImage(f0);
  const type = f.type || (f0.name.toLowerCase().endsWith(".pdf")?"application/pdf":"application/octet-stream");
  if(f.size>MAX_FILE) throw Object.assign(new Error("too_large"),{code:"too_large"});
  const buf=new Uint8Array(await f.arrayBuffer()), n=Math.ceil(buf.length/CHUNK)||1;
  const id = `${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
  const doc=S.db.collection("files").doc(id);
  await doc.set({name:f0.name,type,size:buf.length,chunks:n,owner:S.me,createdAt:new Date().toISOString()});
  for(let i=0;i<n;i++){
    await doc.collection("chunks").doc(String(i)).set({data:firebase.firestore.Blob.fromUint8Array(buf.subarray(i*CHUNK,(i+1)*CHUNK))});
    if(onProgress) onProgress((i+1)/n);
  }
  const rec={id,name:f0.name,type,size:buf.length,chunks:n};
  if(type.startsWith("image/")){ const t=await makeThumb(f); if(t) rec.thumb=t; }
  return rec;
}
async function deleteStored(f){
  if(!f||!f.id) return;
  const doc=S.db.collection("files").doc(f.id);
  const cs=await doc.collection("chunks").get();
  for(const c of cs.docs) await c.ref.delete();
  await doc.delete();
  if(S.fileCache[f.id]){ URL.revokeObjectURL(S.fileCache[f.id]); delete S.fileCache[f.id]; }
}
async function handleFiles(list,d,key,listId,msgId,btnId){
  if(!list.length) return; S.uploading=true;
  const msg=document.getElementById(msgId), btn=document.getElementById(btnId); if(btn) btn.disabled=true;
  let n=0;
  for(const f0 of list){
    n++; if(msg) msg.textContent=`上傳中 ${n}/${list.length}…`;
    try{ d.files.push(await uploadFile(f0, p=>{ if(msg) msg.textContent=`上傳中 ${n}/${list.length}（${Math.round(p*100)}%）…`; })); }
    catch(e){ toastEl(e?.code==="too_large"?`${f0.name} 超過 20MB`:e?.code==="permission-denied"?"沒有上傳權限，請檢查 Firestore 規則":`${f0.name} 上傳失敗`); }
  }
  S.uploading=false; if(btn) btn.disabled=false; if(msg) msg.textContent="";
  const fl=document.getElementById(listId); if(fl){fl.innerHTML=filesHTML(d.files,true); bindRemove(d,listId);}
}

/* ---------- 打包下載 ---------- */
const safeName = n => String(n||"檔案").replace(/[\\/:*?"<>|\u0000-\u001f]/g,"_").slice(0,150);
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; sc.onload=()=>res(window.JSZip); sc.onerror=()=>rej(new Error("jszip")); document.head.appendChild(sc); });
}
async function downloadProjectZip(p){
  if(S.zipping) return;
  const files=projectFileList(p.id);
  S.zipping={done:0,total:files.length}; render();
  const tick=()=>{ S.zipping.done++; const b=document.getElementById("zipBtn"); if(b) b.textContent=`打包中 ${S.zipping.done}/${S.zipping.total}…`; };
  try{
    const JSZip=await loadJSZip(); const zip=new JSZip(); const root=zip.folder(safeName(p.title));
    const statusTxt = p.status==="closed"?"已結案":"進行中";
    root.file("公告.txt",`專案名稱：${p.title}\n狀態：${statusTxt}\n回覆期限：${p.deadline||"無"}\n發布時間：${p.createdAt?new Date(p.createdAt).toLocaleString("zh-TW"):""}\n\n${p.body||""}\n`);
    const addFiles=async(folder,list)=>{ let i=0; for(const f of list){ i++; try{ const {parts}=await fileBytes(f.id); folder.file(`${String(i).padStart(2,"0")}_${safeName(f.name)}`,new Blob(parts)); }catch(e){ folder.file(`${String(i).padStart(2,"0")}_${safeName(f.name)}.讀取失敗.txt`,"此附件已無法讀取"); } tick(); } };
    if(p.files&&p.files.length) await addFiles(root.folder("公告附件"),p.files);
    const rows=[["據點代碼","據點","類別","狀態","回覆時間","回覆內容","附件數"]];
    const rf=root.folder("各據點回覆");
    for(const s of SITES){
      const r=S.replies[replyKey(p.id,s.code)];
      if(!r){ rows.push([s.code,s.name,s.group,"未回覆","","",0]); continue; }
      rows.push([s.code,s.name,s.group,"已回覆",r.updatedAt?new Date(r.updatedAt).toLocaleString("zh-TW"):"",r.text||"",(r.files||[]).length]);
      const sf=rf.folder(safeName(`${s.code}_${s.name}`));
      sf.file("回覆內容.txt",`據點：${s.name}（${s.code}）\n回覆時間：${r.updatedAt?new Date(r.updatedAt).toLocaleString("zh-TW"):""}\n\n${r.text||"（僅附件）"}\n`);
      if(r.files&&r.files.length) await addFiles(sf,r.files);
    }
    const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
    root.file("回覆總表.csv",csv);
    const blob=await zip.generateAsync({type:"blob"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${safeName(p.title)}_${today()}.zip`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    toastEl("已開始下載");
  }catch(e){ toastEl(e?.message==="jszip"?"無法載入壓縮元件，請檢查網路":"打包失敗，請再試一次"); }
  S.zipping=null; render();
}

function genPass(){
  const cs="abcdefghjkmnpqrstuvwxyz23456789", a=new Uint32Array(8);
  crypto.getRandomValues(a); return Array.from(a,x=>cs[x%cs.length]).join("");
}
function acctInner(){

async function createSiteAccounts(){
  if(S.acct?.running) return;
  S.acct={running:true,done:0,list:[],err:null}; renderAcct();
  // 用第二個 Firebase 連線建立帳號，管理者本身不會被登出
  const app2 = firebase.apps.find(a=>a.name==="acct-maker") || firebase.initializeApp(FIREBASE_CONFIG,"acct-maker");
  const a2 = app2.auth();
  try{ await a2.setPersistence(firebase.auth.Auth.Persistence.NONE); }catch(e){}
  for(const s of SITES){
    const pw=genPass();
    try{ await a2.createUserWithEmailAndPassword(emailOf(s.code),pw); S.acct.list.push({s,pw,st:"new"}); try{ await a2.signOut(); }catch(e){} }
    catch(e){
      if(e?.code==="auth/email-already-in-use") S.acct.list.push({s,st:"exists"});
      else { S.acct.list.push({s,st:"fail",err:e?.code||"錯誤"});
        if(/operation-not-allowed|admin-restricted/.test(e?.code||"")){ S.acct.err="Firebase 目前不允許建立帳號：請到 Authentication → Sign-in method 啟用「電子郵件/密碼」，並確認「設定 → 使用者動作」允許建立帳號，再按一次。"; break; }
        if(/too-many-requests/.test(e?.code||"")){ S.acct.err="建立太頻繁被暫時阻擋，請過 1 小時再按一次（已建立的不會重複）。"; break; }
      }
    }
    S.acct.done++; const box=document.getElementById("acctBox"); if(box&&S.acct.running){ const n=box.querySelector(".notice"); if(n) n.textContent=`建立中 ${S.acct.done}/${SITES.length}…請勿關閉此頁`; }
  }
  S.acct.running=false; renderAcct();
}

/* ---------- 儲存空間（Firestore 免費額度 1 GB） ---------- */
const FREE_BYTES = 1*1073741824;
async function loadStorage(){
  if(S.store?.loading) return;
  S.store={...(S.store||{}),loading:true}; renderStorage();
  try{
    const res=await S.db.collection("files").get();
    const ref=referencedIds(), cutoff=Date.now()-24*3600e3;
    const orphans=res.docs.filter(d=>!ref.has(d.id) && Date.parse(d.data().createdAt||0)<cutoff).map(d=>d.id);
    const used=res.docs.reduce((a,d)=>a+(d.data().size||0),0);
    S.store={files:res.size,used,orphans,at:Date.now(),loading:false,err:null};
  }catch(e){ S.store={...S.store,loading:false,at:Date.now(),err:"暫時無法讀取儲存空間，請稍後再按重新整理"}; }
  renderStorage();
}
function storageInner(){
  const head=`<div class="row"><div class="grow section-h">儲存空間</div><button type="button" class="btn sm" id="stRefresh" ${S.store?.loading||S.orphanJob?"disabled":""}>重新整理</button></div>`;
  const st=S.store||{};
  if(st.files==null) return head+`<div class="meta" style="margin-top:4px">${st.err?esc(st.err):"讀取中…"}</div>`;
  const pb=st.used/FREE_BYTES, hi=pb>=0.8;
  let orphHTML="";
  if(S.orphanJob) orphHTML=`<div class="notice" style="margin-top:10px" id="orphProg">清理中 ${S.orphanJob.done}/${S.orphanJob.total}…</div>`;
  else if(st.orphans.length) orphHTML=`<div class="notice" style="margin-top:10px">有 ${st.orphans.length} 個檔案已經沒有任何公告或回覆在使用，多半是據點修改回覆時換掉的舊檔。只會列出上傳超過一天的檔案。
      <div class="row" style="margin-top:8px">${S.orphConfirm?`<span class="overdue">刪除後無法復原。</span><button type="button" class="btn sm danger" id="orphYes">確定清理</button><button type="button" class="btn sm" id="orphNo">取消</button>`:`<button type="button" class="btn sm" id="orphClean">清理這些檔案</button>`}</div></div>`;
  return head+`
    <div class="usage-line"><span class="big">${fmtSize(st.used)}</span><span class="meta">／ 免費額度 1 GB（已用 ${(pb*100).toFixed(1).replace(/\.0$/,"")}%）</span></div>
    <div class="bar meter${hi?" hi":""}" style="margin-top:8px"><i style="width:${Math.min(100,Math.max(pb*100,st.used?0.5:0)).toFixed(1)}%"></i></div>
    <div class="meta" style="margin-top:6px">檔案共 ${st.files} 個${st.loading?" · 更新中…":""}${st.err?` · ${esc(st.err)}`:""}</div>
    ${hi?`<div class="overdue" style="margin-top:6px">空間快用完了，請清除已結案專案的附件。</div>`:""}
    ${orphHTML}`;
}
function renderStorage(){ const box=document.getElementById("storageBox"); if(box){ box.innerHTML=storageInner(); bindStorage(); } }
function bindStorage(){
  document.getElementById("stRefresh")?.addEventListener("click",()=>loadStorage());
  document.getElementById("orphClean")?.addEventListener("click",()=>{ S.orphConfirm=true; renderStorage(); });
  document.getElementById("orphNo")?.addEventListener("click",()=>{ S.orphConfirm=false; renderStorage(); });
  document.getElementById("orphYes")?.addEventListener("click",()=>cleanOrphans());
}
async function clearProjectFiles(pid){
  const p=S.projects.find(x=>x.id===pid); if(!p||S.clearing) return;
  const keys=replyKeysOf(pid).filter(k=>(S.replies[k].files||[]).length);
  const total=projectFileList(pid).length; if(!total) return;
  S.clearing={pid,done:0,total}; render();
  const now=new Date().toISOString(); let removed=0, freed=0, dbFail=false;
  const tick=()=>{ S.clearing.done++; const el=document.getElementById("clr-prog"); if(el) el.textContent=`清除中 ${S.clearing.done}/${S.clearing.total}…`; };
  const delAll=async files=>{ const keep=[]; for(const f of files){ try{ await deleteStored(f); removed++; freed+=f.size||0; }catch(e){ keep.push(f); } tick(); } return keep; };
  for(const k of keys){
    const before=S.replies[k].files||[], keep=await delAll(before);
    if(keep.length===before.length) continue;
    try{ await S.db.collection("replies").doc(k).update(keep.length?{files:keep}:{files:[],filesClearedAt:now}); }catch(e){ dbFail=true; }
  }
  const pFiles=p.files||[]; let pKeep=pFiles;
  if(pFiles.length) pKeep=await delAll(pFiles);
  const left=total-removed;
  if(left===0 || pKeep.length!==pFiles.length){ try{ await S.db.collection("projects").doc(pid).update(left===0?{files:[],filesClearedAt:now}:{files:pKeep}); }catch(e){ dbFail=true; } }
  S.clearing=null;
  toastEl(dbFail ? "附件已刪除，但部分紀錄沒有更新成功，請重新整理頁面" : left===0 ? `已清除 ${removed} 個附件，釋放 ${fmtSize(freed)}` : `已清除 ${removed} 個，還有 ${left} 個沒清掉，請稍後再按一次「清除附件」`);
  render(); loadStorage();
}
async function cleanOrphans(){
  if(S.orphanJob) return;
  const list=S.store?.orphans||[]; S.orphConfirm=false;
  if(!list.length){ renderStorage(); return; }
  S.orphanJob={done:0,total:list.length}; renderStorage();
  let n=0; const ref=referencedIds();
  for(const id of list){
    if(!ref.has(id)){ try{ await deleteStored({id}); n++; }catch(e){} }
    S.orphanJob.done++; const el=document.getElementById("orphProg"); if(el) el.textContent=`清理中 ${S.orphanJob.done}/${S.orphanJob.total}…`;
  }
  S.orphanJob=null; toastEl(`已清理 ${n} 個檔案`); loadStorage();
}

(function start(){
  if(!window.firebase){ S.loadErr="Firebase 程式庫載入失敗，請檢查網路連線後重新整理。"; render(); return; }
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey==="請貼上"){
    S.loadErr=`尚未設定 Firebase。請打開 <code>index.html</code>，把 Firebase 主控台提供的 <code>firebaseConfig</code> 貼到檔案開頭的 <code>FIREBASE_CONFIG</code>。`; render(); return;
  }
  try{ firebase.initializeApp(FIREBASE_CONFIG); S.db=firebase.firestore(); S.auth=firebase.auth(); }
  catch(e){ S.loadErr="Firebase 設定有誤："+esc(e.message); render(); return; }
  S.auth.onAuthStateChanged(user=>{
    S.unsub.forEach(f=>{try{f();}catch(e){}}); S.unsub=[];
    Object.assign(S,{projects:[],replies:{},loaded:false,loadErr:null,draft:{},editingProject:null,store:null,acct:null,projectId:null,focusSite:null,filter:"all"});
    const code = user ? codeOf(user.email) : null;
    if(user && !code){ toastEl("這個帳號不是據點帳號，已登出"); S.auth.signOut(); return; }
    S.user=user||null; S.me=code; S.canEdit=(code===ADMIN_CODE);
    S.site = !code ? null : S.canEdit ? (LS.get("adminSite")||null) : code;
    if(S.view==="account"||S.view==="pick") S.view="home";
    S.authReady=true;
    if(user) subscribe(); else render();
  });
})();
function subscribe(){
  let gotP=false, gotR=false;
  const timer=setTimeout(()=>{ if(!(gotP&&gotR)){ S.loadErr="資料讀取逾時，請檢查網路後重新整理。若是第一次設定，請確認 Firestore 資料庫已建立且規則已發布。"; render(); } },15000);
  const done=()=>{ if(gotP&&gotR){ clearTimeout(timer); S.loaded=true; S.loadErr=null; } render(); };
  const fail=(what)=>e=>{ clearTimeout(timer); S.loadErr=`無法讀取${what}（${esc(e.code||e.message)}）。${e.code==="permission-denied"?"請到 Firebase 主控台 → Firestore Database → 規則，貼上附的 firestore.rules 並發布。":""}`; render(); };
  S.unsub.push(S.db.collection("projects").onSnapshot(snap=>{ S.projects=snap.docs.map(x=>({id:x.id,...x.data()})); gotP=true; done(); }, fail("專案資料")));
  S.unsub.push(S.db.collection("replies").onSnapshot(snap=>{ S.replies={}; snap.docs.forEach(x=>{S.replies[x.id]=x.data();}); gotR=true; done(); }, fail("回覆資料")));
  S.unsub.push(()=>clearTimeout(timer));
  render();
}
</script>
</body>
</html>
